# Smart Cafeteria Speech & Robot State Module Configuration

language: "en-US"

# Speech recognizer settings
listen_timeout: 5
phrase_time_limit: 4
ambient_adjust_duration: 0.6

# Voice commands
done_phrases:
  - "done"
  - "finish"
  - "finished"
  - "start counting"
  - "count now"

yes_phrases:
  - "yes"
  - "yeah"
  - "correct"
  - "confirm"
  - "ok"
  - "okay"

no_phrases:
  - "no"
  - "wrong"
  - "incorrect"
  - "recount"
  - "again"

cancel_phrases:
  - "cancel"
  - "stop"
  - "reset"

# Mock YOLO testing output
mock_detection_json: '{"sandwich": 1, "cola": 1}'
mock_detection_delay: 2.0
